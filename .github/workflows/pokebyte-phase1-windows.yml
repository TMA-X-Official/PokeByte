name: PokeByte Phase 4 Pack 01 Adventure Windows

on:
  push:
    branches: [pokebyte-phase4-pack01-adventure-prototype]
    paths:
      - 'TamaPoke.ino'
      - 'pokebyte/**'
      - '.github/workflows/pokebyte-phase1-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-python
            tar
            xz

      - name: Restore unchanged hardware emulation layer
        run: |
          base64 --decode pc-port.tar.xz.b64 > port.tar.xz
          echo '302077390e4276f13a7491956f4347810b530958ec7ce9bfce5014016dcfa72c  port.tar.xz' | sha256sum --check
          tar -xJf port.tar.xz
          test -f pc/desktop_main.cpp

      - name: Apply PokéByte keyboard and scenery support
        run: |
          python pokebyte/apply_pc_patch.py
          grep -q 'pokebyteToggleBackground' pc/desktop_main.cpp
          grep -q 'pokebyteToggleAmbient' pc/desktop_main.cpp
          grep -q 'pokebyteToggleWeather' pc/desktop_main.cpp
          grep -q 'pokebyteToggleSnow' pc/desktop_main.cpp
          grep -q 'pokebyteTogglePersonality' pc/desktop_main.cpp
          grep -q 'pokebyteSetPersonalityDemo' pc/desktop_main.cpp
          grep -q 'pokebyteSurpriseSetDemo' pc/desktop_main.cpp

      - name: Compile original game with optional PokéByte scenery
        run: bash pokebyte/build-windows.sh

      - name: Verify the grass meadow artwork is packaged
        run: |
          test -s pc/build/windows/PokeByte-Phase1-PC/assets/sunset-forest.bmp
          python -c 'import struct; h=open("pc/build/windows/PokeByte-Phase1-PC/assets/sunset-forest.bmp","rb").read(54); assert h[:2]==b"BM" and struct.unpack_from("<ii",h,18)==(466,466)'

      - name: Make temporary test-only scene fixtures
        run: |
          python pokebyte/test_modes_ci.py
          test -s pc/build/windows/PokeByte-Phase1-PC/assets/meadow_morning.bmp
          test -s pc/build/windows/PokeByte-Phase1-PC/assets/minigame_night.bmp

      - name: Verify five different lighting modes
        timeout-minutes: 3
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          for mode in morning day afternoon evening night; do
            SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-home --time-of-day "$mode"
            test -s tamapoke-test.ppm
            mv tamapoke-test.ppm "mode-$mode.ppm"
            rm -f tamapoke_pc_save.dat
          done
          python -c 'import hashlib,glob; fs=glob.glob("mode-*.ppm"); hs=[hashlib.sha256(open(f,"rb").read()).digest() for f in fs]; assert len(fs)==5 and len(set(hs))==5,(fs,hs);print("Five scene modes render uniquely")'
          rm -f mode-*.ppm

      - name: Verify clear rain snow and exclusivity with real renderer
        timeout-minutes: 3
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          for weather in clear rain snow; do
            SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-home --time-of-day night --weather "$weather"
            test -s tamapoke-test.ppm
            mv tamapoke-test.ppm "weather-$weather.ppm"
            rm -f tamapoke_pc_save.dat
          done
          python -c 'import hashlib; w=["clear","rain","snow"]; hs=[hashlib.sha256(open("weather-"+x+".ppm","rb").read()).digest() for x in w]; assert len(set(hs))==3; print("Cloud-free weather rendering tested: clear, rain, snow")'
          rm -f weather-*.ppm

      - name: Verify short Sleepy label and untranslated language fallback
        run: |
          python -c 'from pathlib import Path; s=Path("TamaPoke.ino").read_text(encoding="utf-8"); block=s.split("static const char *pokebyteTiredStatus()",1)[1].split("const char *statusMsg()",1)[0]; assert "gLang == LANG_EN" in block and "return \"Sleepy\"" in block and "return T(S_EXHAUSTED)" in block; assert "if (pbMood == PB_TIRED) return pokebyteTiredStatus()" in s; assert "if (pet.energy < 25) return pokebyteTiredStatus()" in s; print("Sleepy status and translation fallback verified")'

      - name: Personality action policy and missing-sprite fallback tests
        run: |
          g++ -std=c++17 -O2 -I. pokebyte/personality_pack01.cpp pokebyte/personality_pack02.cpp pokebyte/test_personality_pack01.cpp -o persona-policy-test.exe
          ./persona-policy-test.exe

      - name: Pack 02 bond and temperament policy tests
        run: |
          g++ -std=c++17 -O2 -I. pokebyte/personality_pack02.cpp pokebyte/test_personality_pack02.cpp -o persona-social-test.exe
          ./persona-social-test.exe
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-PLAYFUL-LOW-BOND.bat
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-SHY-HIGH-BOND.bat

      - name: Eight isolated Charmander temperament and bond previews
        timeout-minutes: 6
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          rm -f tamapoke_pc_save.dat
          for temperament in playful calm curious shy; do
            for bond in low high; do
              SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-home --no-save --temperament "$temperament" --bond-preview "$bond" --time-of-day day
              test -s tamapoke-test.ppm
              test ! -e tamapoke_pc_save.dat
              mv tamapoke-test.ppm "social-$temperament-$bond.ppm"
            done
          done
          python -c 'import glob,hashlib; f=glob.glob("social-*.ppm"); h=[hashlib.sha256(open(x,"rb").read()).hexdigest() for x in f]; assert len(f)==8 and len(set(h))==8, (f,h); print("8 mood/bond previews have distinct screenshots and no save writes")'
          rm -f social-*.ppm

      - name: Verify Pack 03 genuine sprites and surprise cooldown policies
        run: |
          g++ -std=c++17 -O2 -I. pokebyte/personality_pack03.cpp pokebyte/test_personality_pack03.cpp -o persona-surprise-test.exe
          ./persona-surprise-test.exe
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-SURPRISE-WAKE.bat
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-SURPRISE-VICTORY.bat
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-SURPRISE-WANDER.bat
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-SURPRISE-FRIENDSHIP.bat

      - name: Verify every surprise ends in normal idle instead of replaying
        run: |
          python -c 'from pathlib import Path; s=Path("TamaPoke.ino").read_text(encoding="utf-8"); assert "void pokebyteFinishOneSurprise(uint32_t now)" in s and "beh.until=now+4500" in s and "pokebyteSurpriseMarkFinished()" in s; assert "void pokebyteAdvanceSurprise(uint32_t now)" in s and s.count("pokebyteAdvanceSurprise(now)")>=2; assert "pbSurpriseStage=2" in s and "pbSurpriseFollowup" in s; print("Distinct staged surprises terminate and return to quiet Idle")'
          python -c 'from pathlib import Path; s=Path("pokebyte/personality_pack03.cpp").read_text(encoding="utf-8"); assert "if(isDemo && demoPlayed)return false" in s and "Back to normal" in s; assert "demoLast" not in s; print("All preview surprise replays disabled")'

      - name: Four save-safe one-click Charmander surprise previews
        timeout-minutes: 4
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          rm -f tamapoke_pc_save.dat
          for event in wake victory wander friendship; do
            SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-home --no-save --surprise-demo "$event" --time-of-day day
            test -s tamapoke-test.ppm
            test ! -e tamapoke_pc_save.dat
            mv tamapoke-test.ppm "surprise-$event.ppm"
            # Screenshot the running real game at 14s to prove the event ended.
            SDL_VIDEODRIVER=dummy timeout 35s ./PokeByte-Phase1-PC.exe --screenshot --test-home --no-save --surprise-demo "$event" --time-of-day day --screenshot-after-ms 14000
            test -s tamapoke-test.ppm
            test ! -e tamapoke_pc_save.dat
            mv tamapoke-test.ppm "finished-$event.ppm"
          done
          python -c 'import glob,hashlib; f=glob.glob("surprise-*.ppm"); h=[hashlib.sha256(open(p,"rb").read()).hexdigest() for p in f]; assert len(f)==4 and len(set(h))==4; print("Four surprise demos distinct, original save untouched")'
          python ../../../../pokebyte/verify_surprise_return.py
          rm -f surprise-*.ppm finished-*.ppm

      - name: Safe Charmander mood previews without save mutation
        timeout-minutes: 3
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          rm -f tamapoke_pc_save.dat
          for mood in happy tired hungry; do
            SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-home --no-save --personality-demo "$mood" --time-of-day day
            test -s tamapoke-test.ppm
            test ! -e tamapoke_pc_save.dat
            mv tamapoke-test.ppm "charmander-$mood.ppm"
          done
          ls -l charmander-*.ppm
          python -c 'import hashlib,glob; fs=glob.glob("charmander-*.ppm"); hs=[hashlib.sha256(open(p,"rb").read()).hexdigest() for p in fs]; assert len(fs)==3 and len(set(hs))==3, (fs,hs); print("Three mood preview renders are distinct")'
          rm -f charmander-*.ppm

      - name: Windows startup and screenshot verification
        timeout-minutes: 2
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          SDL_VIDEODRIVER=dummy timeout 45s ./PokeByte-Phase1-PC.exe --screenshot --test-home
          test -s tamapoke-test.ppm
          rm -f tamapoke-test.ppm tamapoke_pc_save.dat

      - name: Test original ball and training minigames with new background
        timeout-minutes: 3
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          test -s assets/minigame.bmp
          SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-minigame
          test -s tamapoke-test.ppm
          mv tamapoke-test.ppm ball-minigame.ppm
          rm -f tamapoke_pc_save.dat
          SDL_VIDEODRIVER=dummy timeout 40s ./PokeByte-Phase1-PC.exe --screenshot --test-sack
          test -s tamapoke-test.ppm
          mv tamapoke-test.ppm training-minigame.ppm
          rm -f tamapoke_pc_save.dat
          python -c 'import hashlib; a=hashlib.sha256(open("ball-minigame.ppm","rb").read()).digest(); b=hashlib.sha256(open("training-minigame.ppm","rb").read()).digest(); assert a!=b;print("Both minigame render tests passed")'
          rm -f ball-minigame.ppm training-minigame.ppm

      # The existing mouse gesture smoke test is exercised against SDL on Linux.
      # GitHub's headless Windows environment cannot reliably emulate a mouse swipe.
      # The Windows check above verifies the actual executable starts and renders.

      - name: Phase 4 adventure policy and return-home state tests
        run: |
          g++ -std=c++17 -O2 -I. pokebyte/adventure_pack01.cpp pokebyte/test_adventure_pack01.cpp -o adventure-policy-test.exe
          ./adventure-policy-test.exe
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-ADVENTURE-QUIET.bat
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-ADVENTURE-ITEM.bat
          test -s pc/build/windows/PokeByte-Phase1-PC/TEST-ADVENTURE-WILD.bat

      - name: Verify three save-isolated original-PMD adventure previews
        timeout-minutes: 3
        run: |
          cd pc/build/windows/PokeByte-Phase1-PC
          rm -f tamapoke_pc_save.dat
          for event in quiet item wild; do
            SDL_VIDEODRIVER=dummy timeout 30s ./PokeByte-Phase1-PC.exe --screenshot --test-home --no-save --adventure-demo "$event" --time-of-day day --screenshot-after-ms 1100
            test -s tamapoke-test.ppm
            test ! -e tamapoke_pc_save.dat
            mv tamapoke-test.ppm "adventure-$event.ppm"
          done
          python -c 'import hashlib; names=("quiet","item","wild"); sums=[hashlib.sha256(open("adventure-"+n+".ppm","rb").read()).hexdigest() for n in names]; assert len(set(sums))==3,sums; print("Three distinct Adventure results, real renderer, safe demo")'
          rm -f adventure-*.ppm

      - name: Upload Windows executable and original sprites
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PokeByte-Phase4-Pack01-Adventure-Windows
          path: pc/build/windows/PokeByte-Phase1-PC/
          if-no-files-found: error
          retention-days: 30
