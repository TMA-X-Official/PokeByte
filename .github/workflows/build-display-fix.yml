name: Build PokeByte display-fix installer
on:
  push:
    branches:
      - fix/v3.14-display-brightness-2026-10-25
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ESP32 core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GFX Library for Arduino" "SensorLib" "XPowersLib"
          python -m pip install esptool
      - name: Compile firmware
        run: |
          set -euo pipefail
          mkdir -p build/esp32.esp32.esp32s3 web/firmware
          tmp=$(mktemp -d)
          mkdir -p "$tmp/TamaPoke"
          for f in *.ino *.cpp *.c *.h; do
            if [ -f "$f" ]; then ln -s "$PWD/$f" "$tmp/TamaPoke/$f"; fi
          done
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir "$PWD/build/esp32.esp32.esp32s3" "$tmp/TamaPoke"
          B=build/esp32.esp32.esp32s3
          cp "$B/TamaPoke.ino.bootloader.bin" web/firmware/bootloader.bin
          cp "$B/TamaPoke.ino.partitions.bin" web/firmware/partitions.bin
          cp "$B/TamaPoke.ino.bin" web/firmware/app.bin
          BOOT_APP0=$(find "$HOME/.arduino15/packages/esp32/hardware/esp32" -name boot_app0.bin -print -quit)
          test -n "$BOOT_APP0"
          cp "$BOOT_APP0" web/firmware/boot_app0.bin
          python3 tools/check_installer.py
      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: pokebyte-display-fix-installer
          path: web/
          retention-days: 30
