name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    name: Compile firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # Fijado a la version del core verificada para compilar este sketch. Subirla
      # a mano y a proposito: alguna version nueva del core ha roto librerias de
      # terceros antes.
      - name: Install ESP32 core
        run: |
          arduino-cli config init --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install "GFX Library for Arduino" SensorLib XPowersLib U8g2

      # Arduino requires the sketch folder to match TamaPoke.ino.
      # The fork's GitHub repository is named PokeByte; stage a temporary
      # matching folder without renaming or changing any original game files.
      - name: Compile
        run: |
          mkdir -p "$RUNNER_TEMP/TamaPoke"
          cp ./*.ino ./*.cpp ./*.h "$RUNNER_TEMP/TamaPoke/"
          # Preserve the Phase 1–3 native embedded scenery/personality code.
          # The original CI previously omitted the pokebyte/ subdirectory!
          cp -R pokebyte "$RUNNER_TEMP/TamaPoke/pokebyte"
          # Arduino IDE/CLI build only compiles sketch-root .cpp, not arbitrary
          # nested feature modules. Put the three original PMD planners at root.
          cp pokebyte/personality_pack0*.cpp pokebyte/personality_pack0*.h "$RUNNER_TEMP/TamaPoke/"
          arduino-cli compile --warnings=all \
            --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB" \
            --output-dir "$RUNNER_TEMP/PokeByte-firmware-dev" \
            "$RUNNER_TEMP/TamaPoke"

      - name: Label DEV artifacts with checksums (NOT a hardware release)
        run: |
          cd "$RUNNER_TEMP/PokeByte-firmware-dev"
          sha256sum ./*.bin > SHA256SUMS.txt
          cat > DO-NOT-FLASH.txt <<'WARNING'
          POKEBYTE ESP32-S3 HARDWARE-PORT DEVELOPMENT BUILD.
          This artifact is NOT user-approved and is NOT for flashing.
          A passing compile does NOT validate the Waveshare LCD, RTC, PMU,
          touch, power, audio, PSRAM, SD assets, original Pokemon saves,
          firmware rollback, or the no-adapter USB asset uploader.
          DO NOT merge or publish as a consumer installer release.
          The one-click installer stays LOCKED until explicit hardware
          acceptance, full-flash/NVS backups and recovery are verified.
          WARNING

      - uses: actions/upload-artifact@v4
        with:
          name: PokeByte-Phase4-ESP32S3-DEV-DO-NOT-FLASH
          path: |
            ${{ runner.temp }}/PokeByte-firmware-dev/*.bin
            ${{ runner.temp }}/PokeByte-firmware-dev/SHA256SUMS.txt
            ${{ runner.temp }}/PokeByte-firmware-dev/DO-NOT-FLASH.txt
          if-no-files-found: error
          retention-days: 7

  generated:
    name: Generated headers up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pillow

      - name: Regenerate dex.h and species.h
        run: |
          python3 tools/gen_dex.py
          python3 tools/sprites.py emit

      # dex.h y species.h llevan "GENERADO - no editar" en su cabecera; esto pilla
      # a quien edite la salida en vez del generador, o se olvide de regenerar
      # tras tocar los datos de origen.
      - name: Fail if regenerating produced a diff
        run: git diff --exit-code -- dex.h species.h

  tools-lint:
    name: Lint tools/ (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff
      - run: ruff check tools/

  tests:
    name: Game-logic tests (host, no board)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # pet.cpp / i18n.cpp / dex.h compilan y corren en el PC contra unos shims
      # de Arduino, con millis() y random() falsos y una NVS en memoria. Aqui es
      # donde se han roto las cosas: los tres bugs de la v1.3, v1.4 y v1.8 eran
      # logica pura y estos tests los pillan sin tocar la placa.
      - name: Run the suite (plus AddressSanitizer + UBSan)
        run: ./test/run_tests.sh --asan

  i18n:
    name: i18n format-specifier consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 tools/test_i18n_formats.py
